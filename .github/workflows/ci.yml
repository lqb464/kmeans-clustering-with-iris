name: Kiểm thử Clustomer
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,frontend,dev]"
      - run: python -m compileall -q src backend frontend scripts
      - run: ruff check .
      - run: python -m pytest
      - run: docker compose config
