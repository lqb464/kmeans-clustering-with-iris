[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clustomer"
version = "1.0.0"
description = "Phân khúc hành vi khách hàng để hỗ trợ ra quyết định CRM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
frontend = ["streamlit>=1.40,<2", "plotly>=5.24,<7", "requests>=2.32,<3"]
notebooks = ["jupyter>=1,<2", "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "mlflow>=2.17,<4", "scipy>=1.11,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --basetemp=.pytest_tmp"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", "tools", ".venv", ".jupyter", ".ipython"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
